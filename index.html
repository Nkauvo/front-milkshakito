<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilkShakito - Menu & Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        principal: '#fdabac',
                        cinza: '#666666',
                        'fundo-footer': '#bad0ff',
                    },
                    fontFamily: { barlow: ['Barlow', 'sans-serif'] },
                    keyframes: {
                        flutuar: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-40px)' },
                        }
                    },
                    animation: { flutuar: 'flutuar 4s ease-in-out infinite' }
                }
            }
        }
    </script>

    <!-- config pwa -->
     <link rel="stylesheet" href="manifest.json">
     <meta name="theme-color" content="#ca3c3f">
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
     <link rel="apple-touch-icon" href="assets/images/logopwa.png">
     <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logopwa.png">
     <link rel="stylesheet" type="image/png" sizes="16x16" href="assets/images/logopwa.png">
     <link rel="stylesheet" type="image/png" href="assets/images/logopwa.png">
     <link rel="shortcut icon" href="assets/images/logopwa.png" type="image/x-icon">
     <meta name="msappaplication-TileImage" content="assets/images/logopwa.png">
     <meta property="og:image" content="assets/images/logopwa.png">
     <!-- termino -->

    <style>
        /* Slogan aparece com animação ao passar o mouse na logo */
        .slogan-header { opacity: 0; transform: translateX(-20px); max-width: 0; overflow: hidden; transition: all 0.5s ease-in-out; white-space: nowrap; }
        .logo-wrapper:hover .slogan-header { opacity: 1; transform: translateX(0); max-width: 650px; }

        /* Estilo base do botão hamburguer (3 barras) */
        .hamburger {
            width: 30px;
            height: 24px;
            position: relative;
            cursor: pointer;
            z-index: 100;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 3px;
            position: absolute;
            transition: all 0.4s ease-in-out;
            transform-origin: center;
        }
        /* Posições das 3 barrinhas do hamburguer */
        .hamburger span:nth-child(1) { top: 0; }
        .hamburger span:nth-child(2) { top: 10px; }
        .hamburger span:nth-child(3) { top: 20px; }

        /* Quando o menu está aberto (.active), as barras giram e formam um X */
        .hamburger.active span:nth-child(1) { top: 10px; transform: rotate(45deg); }
        .hamburger.active span:nth-child(2) { opacity: 0; transform: translateX(-20px); }
        .hamburger.active span:nth-child(3) { top: 10px; transform: rotate(-45deg); }

        /* Menu lateral que desliza da direita no mobile */
        @media (max-width: 1023px) {
            .nav-menu {
                position: fixed;
                right: -100%;       /* começa escondido fora da tela */
                top: 0;
                width: 75%;
                height: 100vh;
                background-color: white;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 2rem;
                transition: 0.4s ease;
                z-index: 50;
                box-shadow: -10px 0 30px rgba(0,0,0,0.1);
            }
            .nav-menu.active { right: 0; } /* entra na tela quando ativo */

            /* Fundo escuro atrás do menu mobile */
            #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
            #overlay.active { display: block; }

            /* Container de Swipe para deslizar entre categorias no mobile */
            #swipe-outer-container { overflow: hidden; width: 100%; }
            #swipe-container { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
            .category-panel { flex: 0 0 100%; min-width: 100%; padding: 0 20px; box-sizing: border-box; }
        }

        /* Remove o highlight azul ao tocar em itens do menu no celular */
        .menu-item { transition: background-color 0.2s; -webkit-tap-highlight-color: transparent; }

        /* 
           ADICIONADO: Estilos de transição do Modal de Detalhes
           O modal usa opacity para aparecer/sumir suavemente
           e scale para dar o efeito de "crescer" na tela. */
        #detalhes-modal {
            transition: opacity 0.3s ease;
        }
        #detalhes-modal-content {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="font-barlow text-[#222222] bg-white overflow-x-hidden">

    <!-- Fundo escuro para fechar o menu mobile ao clicar fora -->
    <div id="overlay"></div>

    <!-- Botão flutuante do carrinho (aparece no canto inferior esquerdo quando há itens) -->
    <div id="cart-btn" class="fixed bottom-6 left-6 z-[100] bg-principal text-white p-4 rounded-full shadow-2xl cursor-pointer flex items-center gap-2 transition-transform hover:scale-110 hidden">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cart-count" class="font-bold text-lg">0</span>
    </div>

    <!-- Botão flutuante do WhatsApp (canto inferior direito) -->
    <a href="https://wa.me/5515987654321" target="_blank" class="fixed right-4 bottom-4 z-[100] hover:scale-110 transition-transform">
        <img src="./assets/images/whatsapp.png" alt="WhatsApp" class="h-14 w-auto drop-shadow-lg">
    </a>

    <!--  HEADER  -->
    <header class="sticky top-0 z-[60] bg-white px-4 py-4 lg:px-8 lg:shadow-sm">
        <div class="lg:max-w-[1200px] lg:mx-auto flex justify-between items-center">

            <!-- Logo + slogan (slogan aparece só no desktop ao passar o mouse) -->
            <div class="logo-wrapper flex items-center gap-4 cursor-default">
                <img src="./assets/images/logoshake.png" alt="Logo" class="w-32 lg:w-[140px]">
                <span class="slogan-header hidden lg:block font-semibold text-principal text-sm italic">Cremosidade em cada detalhe.</span>
            </div>

            <!-- Botão hamburguer: visível apenas no mobile (lg:hidden) -->
            <button class="hamburger lg:hidden" id="hamburger-btn">
                <span></span><span></span><span></span>
            </button>

            <!-- Menu de navegação: sidebar no mobile, inline no desktop -->
            <nav class="nav-menu lg:block">
                <ul class="flex flex-col lg:flex-row list-none font-bold text-center gap-6 lg:gap-0">
                    <li><a href="#cardapio" class="nav-link block text-xl lg:text-base hover:text-principal lg:ml-8">CARDÁPIO</a></li>
                    <li><button id="cart-menu-link" class="nav-link block w-full text-xl lg:text-base hover:text-principal lg:ml-8 uppercase">CARRINHO</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!--  BANNER  -->
        <section class="flex flex-col items-center text-center px-4 py-12 lg:flex-row lg:justify-between lg:max-w-[1200px] lg:mx-auto lg:py-20">
            <div class="lg:w-1/2 lg:text-left">
                <h1 class="text-4xl lg:text-6xl font-bold leading-tight mb-6">O Shake que você <span class="text-principal italic">sempre sonhou.</span></h1>
                <p class="text-xl text-cinza mb-8">Artesanal, cremoso e irresistível.</p>
                <a href="#cardapio" class="border-2 border-[#333] rounded-xl py-3 px-10 font-bold uppercase hover:bg-[#333] hover:text-white transition-all shadow-lg inline-block">Ver Cardápio</a>
            </div>
            <!-- Imagem com animação de flutuar (definida no tailwind.config acima) -->
            <div class="lg:w-1/2 flex justify-center mt-12 lg:mt-0">
                <img src="./assets/images/shakes.png" alt="Milkshake" class="w-full max-w-[320px] lg:max-w-[550px] animate-flutuar">
            </div>
        </section>

        <!-- CARDÁPIO -->
        <!--
            ATUALIZADO: Cardápio agora é 100% dinâmico.
            Os itens não estão mais escritos no HTML.
            O JavaScript busca os produtos da API e monta
            os cards automaticamente com imagem, nome,
            descrição e preço vindos do Supabase.
        -->
        <section id="cardapio" class="px-4 py-10 lg:max-w-[1100px] lg:mx-auto">
            <h2 class="text-center text-3xl font-bold mb-10">Nosso Menu</h2>

            <!--
                Container dos painéis de categoria.
                No desktop: grid 2 colunas.
                No mobile: painéis deslizáveis com swipe.
                Os painéis são criados dinamicamente pelo JS
                com base nas categorias retornadas pela API.
            -->
            <div id="swipe-outer-container">
                <div id="swipe-container" class="lg:grid lg:grid-cols-2 lg:gap-12">

                    <!--
                        Estado de carregamento (loading).
                        Fica visível enquanto a API ainda não respondeu.
                        O JS remove esse elemento ao renderizar os produtos.
                    -->
                    <div id="cardapio-loading" class="col-span-2 flex justify-center items-center py-16">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-principal"></div>
                    </div>

                </div>
            </div>

            <!--
                Bolinhas indicadoras de painel (dots).
                Ficam escondidas até a API carregar.
                O JS as exibe e ajusta a quantidade conforme
                o número de categorias retornadas.
            -->
            <div id="dots-container" class="hidden justify-center gap-3 mt-8 lg:hidden"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-fundo-footer text-center py-12 mt-20">
        <h3 class="font-bold text-white text-2xl mb-2">MilkShakito</h3>
        <p class="text-[#333] text-sm">&copy; 2026 - O melhor milkshake de Sorocaba.</p>
    </footer>

    <!--
        ADICIONADO: Modal de Detalhes do Produto

        Este modal abre quando o usuário clica em qualquer
        item do cardápio. Ele mostra a imagem, nome, preço,
        descrição e o botão para adicionar ao carrinho.

        Começa invisível (opacity-0 + pointer-events-none).
        O JavaScript remove essas classes para exibi-lo.
    -->
    <div id="detalhes-modal"
        class="fixed inset-0 bg-black/70 z-[80] flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300 px-4">

        <div id="detalhes-modal-content"
            class="bg-white w-full max-w-[400px] rounded-[30px] overflow-hidden transform scale-95 transition-transform duration-300 relative flex flex-col">

            <!-- Botão de fechar o modal (chama fecharModalDetalhes()) -->
            <button onclick="fecharModalDetalhes()"
                class="absolute top-4 right-4 bg-white/80 backdrop-blur-md text-gray-800 w-10 h-10 rounded-full flex justify-center items-center font-bold text-2xl shadow-sm z-10 hover:text-principal active:scale-90 transition-all">
                &times;
            </button>

            <!-- Área da imagem do produto (src preenchido pelo JS) -->
            <div class="w-full h-[240px] bg-gray-50 flex justify-center items-center p-8 relative">
                <div class="absolute inset-0 bg-gradient-to-b from-gray-100 to-white opacity-50"></div>
                <img id="detalhes-img" src="" alt="Produto"
                    class="w-full h-full object-contain drop-shadow-xl relative z-10 transition-transform duration-500 hover:scale-105">
            </div>

            <!-- Área de texto e botão (todos preenchidos dinamicamente pelo JS) -->
            <div class="p-6">
                <h2 id="detalhes-nome" class="text-3xl font-black text-gray-800 mb-1 leading-tight tracking-tight">Nome do Produto</h2>
                <p id="detalhes-preco" class="text-2xl font-black text-principal mb-4">R$ 0,00</p>
                <div class="bg-gray-50 rounded-xl p-4 mb-6">
                    <p id="detalhes-desc" class="text-gray-600 text-sm leading-relaxed font-medium">Descrição do produto...</p>
                </div>

                <!-- onclick definido dinamicamente no JS para cada produto clicado -->
                <button id="detalhes-btn-add"
                    class="w-full bg-principal text-white py-4 rounded-xl text-[17px] font-extrabold shadow-lg hover:brightness-105 active:scale-[0.98] transition-all outline-none flex justify-center items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    Adicionar ao Pedido
                </button>
            </div>
        </div>
    </div>

    <!--
        MODAL DO CARRINHO

        CORREÇÃO: O modal precisa de "flex" para centralizar
        o conteúdo quando estiver visível. Antes só tinha
        "hidden", então ao remover "hidden" nada aparecia
        centralizado. Agora o JS alterna entre hidden e flex.
    -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-[150] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 shadow-2xl relative">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-gray-800">
                <i class="fa-solid fa-cart-shopping text-principal"></i> Seu Pedido
            </h2>

            <!-- Itens do carrinho são injetados aqui pelo JS -->
            <div id="cart-items" class="max-h-[350px] overflow-y-auto mb-6 space-y-4 pr-2"></div>

            <div class="border-t border-gray-100 pt-5 mb-6 flex justify-between font-bold text-xl">
                <span class="text-gray-600">Total:</span>
                <span id="cart-total-value" class="text-principal">R$ 0,00</span>
            </div>

            <!-- Campo para o usuário informar o nome antes de finalizar -->
            <div class="space-y-4 mb-6">
                <input type="text" id="user-name" placeholder="Informe seu nome"
                    class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl outline-none focus:border-principal transition-all">
            </div>

            <div class="flex gap-4">
                <button id="close-cart" class="flex-1 py-4 bg-gray-100 text-gray-600 rounded-2xl font-bold hover:bg-gray-200 transition-all">Voltar</button>
                <button id="checkout-btn" class="flex-[2] py-4 bg-principal text-white rounded-2xl font-bold shadow-lg hover:brightness-105 transition-all">Concluir Pedido</button>
            </div>
        </div>
    </div>

    <script>
        // MENU HAMBURGUER
        // Ao clicar no botão, adiciona/remove a classe "active"
        // no botão (animação X), no nav (desliza) e no overlay
        // (fundo escuro). Ao clicar no overlay, fecha o menu.
        const btn = document.getElementById('hamburger-btn');
        const nav = document.querySelector('.nav-menu');
        const overlay = document.getElementById('overlay');
        const links = document.querySelectorAll('.nav-link');

        const toggleMenu = () => {
            btn.classList.toggle('active');
            nav.classList.toggle('active');
            overlay.classList.toggle('active');
            // Trava o scroll do body enquanto o menu estiver aberto
            document.body.style.overflow = nav.classList.contains('active') ? 'hidden' : 'auto';
        };

        btn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
        // Fecha o menu ao clicar em qualquer link de navegação
        links.forEach(l => l.addEventListener('click', toggleMenu));

        // ADICIONADO: Modal de Detalhes do Produto
        //
        // Guarda referência dos elementos do modal de detalhes.
        const modalDetalhes = document.getElementById('detalhes-modal');
        const modalDetalhesContent = document.getElementById('detalhes-modal-content');

        // Abre o modal e preenche com os dados do produto clicado
        function abrirModalDetalhes(nome, preco, desc, img) {
            // Vibração tátil leve ao abrir (funciona em celulares)
            if (navigator.vibrate) navigator.vibrate(40);

            // Preenche os campos do modal com os dados recebidos
            document.getElementById('detalhes-nome').innerText = nome;
            document.getElementById('detalhes-preco').innerText = `R$ ${parseFloat(preco).toFixed(2).replace('.', ',')}`;
            document.getElementById('detalhes-desc').innerText = desc;
            document.getElementById('detalhes-img').src = img || './assets/images/logoshake.png';

            // Define dinamicamente o que o botão "Adicionar" faz para este produto
            document.getElementById('detalhes-btn-add').onclick = function () {
                adicionarItem(nome, parseFloat(preco));
                fecharModalDetalhes(); // fecha o modal após adicionar
            };

            // Torna o modal visível (remove as classes que o escondem)
            modalDetalhes.classList.remove('opacity-0', 'pointer-events-none');
            // Pequeno delay para a animação de escala funcionar corretamente
            setTimeout(() => {
                modalDetalhesContent.classList.remove('scale-95');
                modalDetalhesContent.classList.add('scale-100');
            }, 10);
        }

        // Fecha o modal com animação reversa (encolhe e some)
        function fecharModalDetalhes() {
            modalDetalhesContent.classList.remove('scale-100');
            modalDetalhesContent.classList.add('scale-95');
            // Espera a animação de escala terminar antes de esconder
            setTimeout(() => {
                modalDetalhes.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        // ADICIONADO: Fecha o modal de detalhes ao clicar no fundo escuro
        // e.target === modalDetalhes garante que só fecha se clicar fora do card
        modalDetalhes.addEventListener('click', function (e) {
            if (e.target === modalDetalhes) fecharModalDetalhes();
        });

        // LÓGICA DO CARRINHO
        // Array que guarda os itens do carrinho em memória
        let carrinho = [];

        // ADICIONADO: inicializarCarrinho()
        // Antes o carrinho começava sempre vazio ao abrir a página.
        // Agora ele lê o localStorage e restaura os itens salvos,
        // então o usuário não perde o pedido ao recarregar a página.
        function inicializarCarrinho() {
            const carrinhoSalvo = localStorage.getItem('milk_cart');
            if (carrinhoSalvo) {
                // Converte o texto JSON de volta para array JavaScript
                carrinho = JSON.parse(carrinhoSalvo);
                // Atualiza a tela com os itens recuperados
                atualizarCarrinhoUI();
            }
        }

        // Referências aos elementos visuais do carrinho
        const cartModal = document.getElementById('cart-modal');
        const cartItemsDiv = document.getElementById('cart-items');
        const cartTotalValue = document.getElementById('cart-total-value');
        const cartCount = document.getElementById('cart-count');
        const cartBtn = document.getElementById('cart-btn');

        // ADICIONADO: adicionarItem()
        // Função centralizada para adicionar produtos ao carrinho.
        // É chamada pelo botão dentro do modal de detalhes.
        // Se o item já existir, apenas aumenta a quantidade.
        function adicionarItem(nome, preco) {
            // Vibração de feedback ao adicionar item
            if (navigator.vibrate) navigator.vibrate(200);

            // Verifica se o item já está no carrinho
            const ex = carrinho.find(i => i.nome === nome);
            if (ex) {
                ex.qtd++; // já existe: incrementa a quantidade
            } else {
                carrinho.push({ nome, preco, qtd: 1 }); // novo item
            }
            atualizarCarrinhoUI();
        }

        // Renderiza a lista de itens no modal do carrinho e atualiza totais
        function atualizarCarrinhoUI() {
            cartItemsDiv.innerHTML = '';
            let total = 0, totalItens = 0;

            // Se carrinho vazio, exibe mensagem
            if (carrinho.length === 0) {
                cartItemsDiv.innerHTML = '<p class="text-center text-gray-400 py-10">Carrinho vazio...</p>';
            }

            // Para cada item, cria um card com nome, preço, controles de quantidade e botão remover
            carrinho.forEach((item, index) => {
                total += item.preco * item.qtd;
                totalItens += item.qtd;
                cartItemsDiv.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-2xl">
                        <div class="flex-1">
                            <p class="font-bold text-gray-800">${item.nome}</p>
                            <div class="flex items-center gap-3 mt-1">
                                <button onclick="alterarQtd(${index}, -1)" class="w-7 h-7 flex items-center justify-center bg-white border rounded-lg shadow-sm hover:bg-gray-50">-</button>
                                <span class="font-bold text-sm">${item.qtd}</span>
                                <button onclick="alterarQtd(${index}, 1)" class="w-7 h-7 flex items-center justify-center bg-white border rounded-lg shadow-sm hover:bg-gray-50">+</button>
                            </div>
                        </div>
                        <div class="flex items-center gap-5">
                            <span class="font-bold text-principal">R$ ${(item.preco * item.qtd).toFixed(2)}</span>
                            <button onclick="removerItem(${index})" class="text-red-400 hover:text-red-600 transition-colors">
                                <i class="fa-solid fa-trash-can text-lg"></i>
                            </button>
                        </div>
                    </div>`;
            });

            // Atualiza o total exibido e o contador no botão flutuante
            cartTotalValue.innerText = `R$ ${total.toFixed(2)}`;
            cartCount.innerText = totalItens;

            // Mostra ou esconde o botão flutuante do carrinho conforme quantidade
            cartBtn.classList.toggle('hidden', totalItens === 0);

            // Salva o estado atual do carrinho no localStorage para persistir entre recarregamentos
            localStorage.setItem('milk_cart', JSON.stringify(carrinho));
        }

        // Aumenta ou diminui a quantidade de um item (delta = +1 ou -1)
        window.alterarQtd = (index, delta) => {
            carrinho[index].qtd += delta;
            if (carrinho[index].qtd <= 0) removerItem(index); // remove se chegar a 0
            else atualizarCarrinhoUI();
        };

        // Remove um item do carrinho pelo índice
        window.removerItem = (index) => {
            carrinho.splice(index, 1);
            atualizarCarrinhoUI();
        };

        // ADICIONADO: Integração com a API — Carregamento dinâmico
        //
        // A URL base da API do backend hospedado na Vercel.
        // Todos os produtos e categorias vêm daqui.
        const API_URL = 'https://backend-aula07-milkshakito-vercel.vercel.app/api';

        // Guarda os produtos retornados pela API para uso posterior
        let todosProdutos = [];

        // ADICIONADO: carregarCardapio()
        //
        // Faz um fetch na rota /api/produtos, recebe o JSON
        // com todos os produtos (incluindo imagem do Supabase),
        // agrupa por categoria_id e monta os painéis do cardápio
        // dinamicamente no HTML — sem nada fixo no código.
        async function carregarCardapio() {
            try {
                // Busca todos os produtos da API
                const response = await fetch(`${API_URL}/produtos`);
                todosProdutos = await response.json();

                // Agrupa os produtos por categoria_id
                // Resultado: { 1: [produto, produto], 2: [produto, produto] }
                const grupos = {};
                todosProdutos.forEach(p => {
                    if (!grupos[p.categoria_id]) grupos[p.categoria_id] = [];
                    grupos[p.categoria_id].push(p);
                });

                // Nomes das categorias mapeados por id
                // (baseado nos dados do Supabase: categoria 1 = Clássicos, 2 = Especiais)
                const nomesCategorias = {
                    1: 'Clássicos',
                    2: 'Especiais'
                };

                const swipeContainer = document.getElementById('swipe-container');
                const dotsContainer = document.getElementById('dots-container');

                // Remove o loading spinner antes de renderizar
                document.getElementById('cardapio-loading').remove();

                const categoriaIds = Object.keys(grupos);

                // Para cada categoria, cria um painel com seus produtos
                categoriaIds.forEach((catId, index) => {
                    const produtos = grupos[catId];
                    const nomeCat = nomesCategorias[catId] || `Categoria ${catId}`;

                    // Cria o painel da categoria
                    const panel = document.createElement('div');
                    panel.className = `category-panel${index > 0 ? ' mt-8 lg:mt-0' : ''}`;

                    // Título da categoria
                    panel.innerHTML = `
                        <h3 class="text-principal text-xl font-bold border-b-2 border-gray-100 pb-2 mb-4">
                            ${nomeCat}
                        </h3>
                    `;

                    // Cria um item de menu para cada produto da categoria
                    produtos.forEach(p => {
                        const precoFormatado = `R$ ${parseFloat(p.preco).toFixed(2).replace('.', ',')}`;

                        // Div clicável do produto com imagem vinda do Supabase
                        const item = document.createElement('div');
                        item.className = 'menu-item flex items-center gap-4 py-4 border-b border-dashed cursor-pointer';

                        item.innerHTML = `
                            <!--
                                ADICIONADO: Imagem do produto
                                A URL da imagem vem diretamente do campo "imagem"
                                retornado pela API (armazenado no Supabase).
                                onerror garante que se a imagem falhar, exibe
                                a logo como fallback.
                            -->
                            <img
                                src="${p.imagem}"
                                alt="${p.nome}"
                                class="w-16 h-16 object-cover rounded-xl flex-shrink-0 shadow-sm"
                                onerror="this.src='./assets/images/logoshake.png'">

                            <div class="flex-1">
                                <p class="font-bold">${p.nome}</p>
                                <p class="text-sm text-cinza">${p.descricao}</p>
                            </div>

                            <div class="text-principal font-bold text-lg flex-shrink-0">${precoFormatado}</div>
                        `;

                        // Ao clicar no item, abre o modal de detalhes com os dados da API
                        item.addEventListener('click', () => {
                            // Efeito visual de flash rosa ao tocar
                            item.style.backgroundColor = '#fff0f1';
                            setTimeout(() => item.style.backgroundColor = 'transparent', 200);

                            // Abre o modal passando os dados do produto (imagem do Supabase inclusa)
                            abrirModalDetalhes(p.nome, p.preco, p.descricao, p.imagem);
                        });

                        panel.appendChild(item);
                    });

                    swipeContainer.appendChild(panel);

                    // Cria uma bolinha indicadora para cada categoria (só aparece no mobile)
                    const dot = document.createElement('div');
                    dot.id = `dot-${index}`;
                    dot.className = `w-2.5 h-2.5 rounded-full transition-colors ${index === 0 ? 'bg-principal' : 'bg-gray-300'}`;
                    dotsContainer.appendChild(dot);
                });

                // Exibe as bolinhas agora que os painéis foram criados
                dotsContainer.classList.remove('hidden');
                dotsContainer.classList.add('flex');

                // Inicializa o swipe mobile após os painéis estarem no DOM
                inicializarSwipe(categoriaIds.length);

            } catch (error) {
                // Se a API falhar, exibe mensagem de erro no lugar do cardápio
                console.error('Erro ao carregar cardápio:', error);
                document.getElementById('swipe-container').innerHTML = `
                    <p class="col-span-2 text-center text-red-400 py-10">
                        Erro ao carregar o cardápio. Tente novamente mais tarde.
                    </p>`;
            }
        }

        // ADICIONADO: inicializarSwipe()
        //
        // Antes o swipe era fixo para 2 painéis (dot-0 e dot-1).
        // Agora recebe o total de painéis dinamicamente,
        // funcionando para qualquer número de categorias da API.
        function inicializarSwipe(totalPaineis) {
            const container = document.getElementById('swipe-container');
            let startX = 0, currentIndex = 0;

            // Registra onde o dedo começou o toque
            container.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            // Ao soltar o dedo, verifica se foi um swipe válido
            container.addEventListener('touchend', e => {
                if (window.innerWidth >= 1024) return; // swipe só no mobile
                const diff = e.changedTouches[0].clientX - startX;

                if (Math.abs(diff) > 60) { // mínimo de 60px para considerar swipe
                    // Garante que o índice não ultrapasse os limites
                    if (diff < 0 && currentIndex < totalPaineis - 1) currentIndex++;
                    else if (diff > 0 && currentIndex > 0) currentIndex--;

                    // Desliza o container para o painel correto
                    container.style.transform = `translateX(-${currentIndex * 100}%)`;

                    // Atualiza a cor das bolinhas indicadoras
                    for (let i = 0; i < totalPaineis; i++) {
                        const dot = document.getElementById(`dot-${i}`);
                        if (dot) dot.style.backgroundColor = i === currentIndex ? '#fdabac' : '#d1d5db';
                    }
                }
            });
        }

        // Inicia o carregamento do cardápio via API ao carregar a página
        // carregarCardapio();

        // ADICIONADO: abrirModalCarrinho() e fecharModalCarrinho()
        //
        // CORREÇÃO: O modal do carrinho usava só "hidden" para
        // esconder. Mas para ele aparecer centralizado na tela
        // é preciso de "flex". O JS agora alterna entre as duas
        // classes corretamente ao abrir e fechar.
        function abrirModalCarrinho() {
            cartModal.classList.remove('hidden'); // remove o que esconde
            cartModal.classList.add('flex');      // adiciona flex para centralizar
        }

        function fecharModalCarrinho() {
            cartModal.classList.add('hidden');    // esconde novamente
            cartModal.classList.remove('flex');   // remove o flex
        }

        // Abre o carrinho ao clicar no botão flutuante
        cartBtn.addEventListener('click', abrirModalCarrinho);

        // Abre o carrinho ao clicar no link "CARRINHO" do menu de navegação
        document.getElementById('cart-menu-link').addEventListener('click', () => {
            abrirModalCarrinho();
            toggleMenu(); // fecha o menu lateral também
        });

        // Fecha o carrinho ao clicar no botão "Voltar"
        document.getElementById('close-cart').addEventListener('click', fecharModalCarrinho);

        // ADICIONADO: Fecha o carrinho ao clicar no fundo escuro
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) fecharModalCarrinho();
        });

        // GPS E FINALIZAÇÃO DO PEDIDO
        // Ao clicar em "Concluir Pedido":
        // 1. Valida o nome e se há itens no carrinho
        // 2. Tenta pegar a localização GPS do usuário
        // 3. Exibe confirmação com nome e coordenadas
        // 4. Limpa o carrinho e fecha o modal
        const checkoutBtn = document.getElementById('checkout-btn');
        checkoutBtn.addEventListener('click', () => {
            const nome = document.getElementById('user-name').value;
            if (!nome) return alert("Informe seu nome para continuar!");
            if (carrinho.length === 0) return alert("Seu carrinho está vazio!");

            const originalText = checkoutBtn.innerText;
            checkoutBtn.disabled = true;
            checkoutBtn.innerText = "Buscando GPS...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    // Sucesso: GPS encontrou a localização
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        checkoutBtn.disabled = false;
                        checkoutBtn.innerText = originalText;

                        alert(`✅ PEDIDO CONCLUÍDO!\n\nCliente: ${nome}\nLocalização: ${lat.toFixed(5)}, ${lon.toFixed(5)}\n\nObrigado por pedir no MilkShakito! Seu carrinho foi limpo.`);

                        carrinho = [];
                        atualizarCarrinhoUI();
                        fecharModalCarrinho();
                        document.getElementById('user-name').value = '';
                    },
                    // Erro: GPS não disponível ou bloqueado pelo usuário
                    (err) => {
                        checkoutBtn.disabled = false;
                        checkoutBtn.innerText = originalText;
                        alert(`Pedido confirmado, ${nome}! (GPS não disponível, mas anotamos seu pedido)`);
                        carrinho = [];
                        atualizarCarrinhoUI();
                        fecharModalCarrinho();
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                // Navegador não suporta geolocalização
                alert(`Pedido finalizado, ${nome}!`);
                carrinho = [];
                atualizarCarrinhoUI();
                fecharModalCarrinho();
            }
        });

        // Chamada inicial ao carregar a página:
        // 1. Restaura o carrinho salvo no localStorage
        // 2. Busca o cardápio na API (com imagens do Supabase)

        inicializarCarrinho();
        carregarCardapio();

        if('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registrado no Porto! 🍣', reg))
                .catch(err => console.error('Erro ao preparar o sushi: ', err));
            });
        }

    </script>
</body>
</html>
